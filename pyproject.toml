[project]
name = "payment-fraud-analytics-platform"
version = "1.0.0"
description = "End-to-End Anti-Fraud Intelligence & Payments Transaction Risk Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
